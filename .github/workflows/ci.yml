name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test and format
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SystemCompass.slnx

      - name: Build
        run: dotnet build SystemCompass.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/SystemCompass.Tests/SystemCompass.Tests.csproj -c Release --no-build

      - name: Format check
        run: dotnet format SystemCompass.slnx --verify-no-changes --no-restore

      - name: Clean-room check
        shell: pwsh
        run: ./scripts/check-clean-room.ps1

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Confirm:$false
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Error,Warning
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Output
            exit 1
          }
          Write-Output "PSScriptAnalyzer found no errors or warnings."
